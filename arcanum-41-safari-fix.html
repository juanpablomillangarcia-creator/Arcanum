<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0613" />
<title>ARCANUM — Herramientas de Dragones y Mazmorras</title>
<script>
(function(){
  function show(msg){
    try{
      var b = document.getElementById('__err_overlay');
      if(!b){
        b = document.createElement('div');
        b.id = '__err_overlay';
        b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483647;max-height:60%;overflow:auto;background:#3b0d0d;color:#ffd9d9;font:12px/1.45 monospace;padding:10px 12px;border-top:2px solid #8a463f';
        var x = document.createElement('button');
        x.textContent = 'cerrar';
        x.style.cssText = 'float:right;background:#c9a55a;color:#1a0f1a;border:none;border-radius:6px;padding:4px 10px;font:bold 12px monospace;cursor:pointer;';
        x.onclick = function(){ 
          if(b && b.parentNode){ 
            b.parentNode.removeChild(b); 
          } 
        };
        b.appendChild(x);
        var t = document.createElement('div');
        t.id = '__err_overlay_txt';
        t.textContent = 'ARCANUM - diagnostico (copia esto y mandaselo a tu DM):\n';
        b.appendChild(t);
        (document.body || document.documentElement).appendChild(b);
      }
      var tx = document.getElementById('__err_overlay_txt');
      if(tx){ tx.textContent += msg + '\n'; }
      try { document.title = 'ARCANUM ERROR'; } catch(e){}
    }catch(e){}
  }
  window.__arcShow = show;
  window.addEventListener('error', function(ev){
    if(ev && ev.target && ev.target !== window && (ev.target.tagName || ev.target.src || ev.target.href)){ return; }
    if(!(ev && (ev.error || ev.message))){ return; }
    var m = (ev && ev.message) ? ev.message : ((ev && ev.error && ev.error.message) ? ev.error.message : 'error');
    var f = (ev && ev.filename) ? (' @ ' + String(ev.filename).split('/').pop() + ':' + ev.lineno + ':' + ev.colno) : '';
    show('JS: ' + m + f);
  });
  window.addEventListener('unhandledrejection', function(ev){
    if(!(ev && ev.reason)){ return; }
    var r = (ev.reason && ev.reason.message) ? ev.reason.message : ev.reason;
    show('Promesa: ' + r);
  });
  window.addEventListener('load', function(){
    setTimeout(function(){
      if(!window.__arcanumReady){
        show('La app NO termino de iniciarse (4s). Si arriba no hay un error JS, tu Safari quiza no soporta parte del codigo. Dime que version de Safari / macOS / iOS usas.');
      }
    }, 4000);
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ARCANUM — Sistema de diseño (SAFARI COMPATIBLE)
   ========================================================= */
:root{
  /* Fondos: negros con un punto de ciruela apagado, ya no tan violetas */
  --bg-void: #0a0709;
  --bg-deep: #130e14;
  --bg-mid:  #1d1620;
  --bg-card: #18121c;
  --bg-card-2:#231a28;
  --line:    #2c2230;
  --line-bright:#3d2f44;

  /* Tintas tipo pergamino */
  --ink:     #ece6d2;
  --ink-dim: #a89c7d;
  --ink-soft:#7a6f5a;

  /* Oro envejecido */
  --gold:    #c9a55a;
  --gold-bright:#e8c878;
  --gold-deep:#8a6f2e;

  /* Arcano: ciruela / vino añejo */
  --arcane:  #6b3f5a;
  --arcane-bright:#a06987;
  --arcane-deep:#3d2233;

  /* Acentos */
  --blood:   #a8463f;
  --emerald: #6b8a5a;
  --frost:   #7a98b0;

  /* Acentos por herramienta */
  --acc-search:    #7a98b0;
  --acc-dice:      #c9a55a;
  --acc-character: #8a9461;
  --acc-npc:       #b08b5a;
  --acc-monster:   #a8463f;
  --acc-encounter: #b07a4a;
  --acc-tracker:   #c98a3a;
  --acc-spell:     #8a5575;
  --acc-item:      #c9a55a;
  --acc-dungeon:   #8a8278;
  --acc-loot:      #d4a247;
  --acc-city:      #6a7d8a;
  --acc-oracle:    #9d6db0;
  --acc-prep:      #8a9bb0;

  /* Tipografía */
  --font-display: 'Cinzel Decorative', 'Cormorant Garamond', serif;
  --font-title:   'Cormorant SC', 'Cormorant Garamond', serif;
  --font-body:    'Cormorant Garamond', Georgia, serif;
  --font-mono:    'JetBrains Mono', monospace;

  --shadow-lift: 0 20px 60px -20px rgba(107, 63, 90, 0.35), 0 8px 24px -8px rgba(0,0,0,0.6);
  --shadow-deep: 0 30px 80px -20px rgba(0,0,0,0.7);
  --glow-arcane: 0 0 40px rgba(160, 105, 135, 0.25);
  --glow-gold: 0 0 30px rgba(201, 165, 90, 0.3);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%}
body{
  font-family: var(--font-body);
  font-size: 18px;
  color: var(--ink);
  background: var(--bg-void);
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  position: relative;
}

/* Fondo atmosférico global */
body::before{
  content:'';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(107, 63, 90, 0.20), transparent 55%),
    radial-gradient(ellipse at 85% 80%, rgba(201, 165, 90, 0.10), transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(61, 34, 51, 0.10), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after{
  content:'';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 3px);
  pointer-events: none;
  z-index: 1;
  mix-blend-mode: overlay;
}

/* Ruido sutil */
.noise{
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: 0.04;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='2' /><feDisplacementMap in='SourceGraphic' scale='80' /></filter><rect width='200' height='200' fill='%23000' filter='url(%23n)' opacity='0.5'/></svg>");
  background-size: 200px 200px;
}

/* ========== LAYOUT ========== */
.app{
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr;
}

/* ========== SIDEBAR ========== */
.sidebar{
  background: linear-gradient(180deg, rgba(15, 10, 28, 0.95), rgba(7, 5, 13, 0.95));
  border-right: 1px solid var(--line);
  padding: 32px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}

.brand{
  padding: 0 28px 28px;
  border-bottom: 1px solid var(--line);
}

.brand-mark{
  display:flex;
  align-items:center;
  gap: 12px;
  margin-bottom: 8px;
}

.brand-rune{
  width: 38px;
  height: 38px;
  display:grid;
  place-items:center;
  border: 1px solid var(--gold-deep);
  background: radial-gradient(circle, rgba(201,165,90,0.15), transparent 70%);
  transform: rotate(45deg);
  position: relative;
  flex-shrink: 0;
}

.brand-rune svg{
  transform: rotate(-45deg);
  width: 20px;
  height: 20px;
}

.brand-name{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.18em;
  color: var(--gold-bright);
  line-height: 1;
}

.brand-tag{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.4em;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin-top: 4px;
}

.nav{
  padding: 24px 16px;
}

.nav-section{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--ink-soft);
  text-transform: uppercase;
  padding: 18px 12px 8px;
}

.nav-item{
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--ink-dim);
  cursor: pointer;
  border-left: 2px solid transparent;
  margin-bottom: 2px;
  transition: all 0.25s ease;
  position: relative;
  user-select: none;
  background: transparent;
}

.nav-item:hover{
  color: var(--ink);
  background: rgba(138, 92, 246, 0.06);
  border-left-color: var(--arcane-deep);
}

.nav-item.active{
  color: var(--gold-bright);
  background: linear-gradient(90deg, rgba(201, 165, 90, 0.1), transparent);
  border-left-color: var(--gold);
}

.nav-item.locked{
  opacity: 0.45;
  cursor: not-allowed;
}

.nav-item.locked:hover{
  background: transparent;
  border-left-color: transparent;
  color: var(--ink-dim);
}

.nav-icon{
  width: 22px;
  text-align: center;
  flex-shrink: 0;
  font-size: 16px;
}

.nav-soon{
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--arcane);
  border: 1px solid var(--arcane-deep);
  padding: 2px 6px;
  border-radius: 2px;
  flex-shrink: 0;
}

.sidebar-foot{
  padding: 20px 24px;
  border-top: 1px solid var(--line);
  margin-top: 20px;
}

.btn-data{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding: 10px;
  background: transparent;
  border: 1px solid var(--line-bright);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 8px;
}

.btn-data:hover{
  border-color: var(--gold);
  color: var(--gold-bright);
  background: rgba(201, 165, 90, 0.05);
}

/* ========== MAIN ========== */
.main{
  padding: 0;
  min-height: 100vh;
  position: relative;
}

.view{
  display: none;
  animation: viewIn 0.5s ease both;
}

.view.active{
  display:block;
}

@keyframes viewIn{
  from{ opacity: 0; transform: translateY(10px); }
  to  { opacity: 1; transform: translateY(0); }
}

/* ========== HOME ========== */
.hero{
  position: relative;
  min-height: 100vh;
  padding: 80px 40px 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}

.hero-bg{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity: 0.5;
}

.hero-bg svg{
  width: 100%;
  height: 100%;
}

.hero-eyebrow{
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.5em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 28px;
  opacity: 0;
  animation: fadeUp 0.8s 0.2s ease forwards;
}

.hero-eyebrow::before{
  content:'';
  display:inline-block;
  width: 60px;
  height: 1px;
  background: var(--gold);
  vertical-align: middle;
  margin-right: 16px;
}

.hero-title{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(52px, 9vw, 130px);
  line-height: 1;
  letter-spacing: 0.01em;
  color: var(--ink);
  margin-bottom: 36px;
  opacity: 0;
  animation: fadeUp 1s 0.35s ease forwards;
}

.hero-title .word{
  display: block;
}

.hero-title .word-arc{
  font-weight: 900;
  color: transparent;
  background: linear-gradient(135deg, var(--gold-bright), var(--arcane-bright), var(--gold-bright));
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  animation: shimmer 8s ease infinite;
}

@keyframes shimmer{
  0%,100%{ background-position: 0% 50%; }
  50%{ background-position: 100% 50%; }
}

.hero-lead{
  font-family: var(--font-body);
  font-size: clamp(18px, 1.8vw, 22px);
  font-style: italic;
  color: var(--ink-dim);
  max-width: 620px;
  margin-bottom: 56px;
  opacity: 0;
  animation: fadeUp 1s 0.55s ease forwards;
}

.hero-lead em{
  color: var(--gold);
  font-style: normal;
  font-family: var(--font-display);
  letter-spacing: 0.1em;
}

.hero-actions{
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeUp 1s 0.75s ease forwards;
}

.btn{
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  padding: 18px 32px;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  -webkit-appearance: none;
  appearance: none;
}

.btn-primary{
  background: linear-gradient(135deg, var(--gold-deep), var(--gold));
  color: var(--bg-void);
  box-shadow: var(--glow-gold);
}

.btn-primary:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 40px rgba(201, 165, 90, 0.5);
}

.btn-primary:active{
  transform: translateY(0);
}

.btn-ghost{
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line-bright);
}

.btn-ghost:hover{
  border-color: var(--arcane);
  color: var(--arcane-bright);
  background: rgba(138, 92, 246, 0.06);
}

@keyframes fadeUp{
  from { opacity:0; transform: translateY(24px); }
  to   { opacity:1; transform: translateY(0); }
}

/* ========== TOOL GRID ========== */
.tools{
  padding: 100px 40px;
  position: relative;
}

.section-head{
  display: flex;
  align-items: baseline;
  gap: 24px;
  margin-bottom: 60px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}

.section-num{
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--gold);
}

.section-title{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 38px;
  letter-spacing: 0.04em;
  color: var(--ink);
  flex: 1;
  min-width: 250px;
}

.section-line{
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
  min-width: 50px;
}

.tool-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
}

.tool-card{
  background: linear-gradient(180deg, var(--bg-card), var(--bg-card-2));
  border: 1px solid var(--line);
  padding: 28px 24px;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(.2,.7,.3,1);
  position: relative;
  overflow: hidden;
  --card-acc: var(--gold);
}

.tool-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--card-acc), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s;
}

.tool-card:hover::before{
  transform: translateX(100%);
}

.tool-card:hover{
  border-color: rgba(201, 165, 90, 0.6);
  transform: translateY(-4px);
  box-shadow: 0 20px 60px rgba(201, 165, 90, 0.25), 0 8px 24px rgba(0,0,0,0.6);
}

.tool-card.locked{
  opacity: 0.5;
  cursor: not-allowed;
}

.tool-card.locked:hover{
  transform: none;
  border-color: var(--line);
  box-shadow: none;
}

.tool-icon{
  width: 52px;
  height: 52px;
  margin-bottom: 20px;
  display:grid;
  place-items:center;
  color: var(--gold);
  border: 1px solid var(--gold-deep);
  background: radial-gradient(circle, rgba(201,165,90,0.1), transparent 70%);
  transition: all 0.3s;
}

.tool-card:hover .tool-icon{
  border-color: var(--gold);
  color: var(--gold-bright);
  box-shadow: var(--glow-gold);
}

.tool-name{
  font-family: var(--font-title);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: 0.05em;
  color: var(--ink);
  margin-bottom: 8px;
}

.tool-desc{
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--ink-dim);
  font-style: italic;
  line-height: 1.4;
}

.tool-badge{
  position:absolute;
  top: 16px;
  right: 16px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--arcane-bright);
  border: 1px solid var(--arcane-deep);
  padding: 3px 8px;
  background: rgba(138, 92, 246, 0.1);
}

/* ========== DICE VIEW ========== */
.page{
  padding: 60px 40px;
  max-width: 1400px;
  margin: 0 auto;
}

.page-head{
  margin-bottom: 48px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.page-eyebrow{
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.4em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 16px;
}

.page-title{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 48px;
  letter-spacing: 0.03em;
  color: var(--ink);
  margin-bottom: 14px;
  line-height: 1.05;
}

.page-sub{
  font-family: var(--font-body);
  font-style: italic;
  font-size: 19px;
  color: var(--ink-dim);
  max-width: 700px;
}

/* ========== TABS ========== */
.tabs{
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 36px;
  overflow-x: auto;
}

.tab{
  padding: 14px 28px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-soft);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.25s;
  background: transparent;
  border-top: none;
  border-left: none;
  border-right: none;
  white-space: nowrap;
  -webkit-appearance: none;
  appearance: none;
}

.tab:hover{
  color: var(--ink);
}

.tab.active{
  color: var(--gold-bright);
  border-bottom-color: var(--gold);
}

.tab-panel{
  display:none;
}

.tab-panel.active{
  display:block;
  animation: viewIn 0.4s ease both;
}

/* ========== DICE LAYOUT ========== */
.dice-layout{
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 48px;
}

@media (max-width: 1024px) {
  .dice-layout {
    grid-template-columns: 1fr;
  }
}

.dice-controls{
  background: var(--bg-card);
  border: 1px solid var(--line);
  padding: 32px;
}

.dice-row{
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  margin-bottom: 32px;
}

.die{
  padding: 0;
  background: linear-gradient(135deg, var(--bg-card-2), var(--bg-mid));
  border: 1px solid var(--line-bright);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  font-family: var(--font-title);
  /* Reemplazo de aspect-ratio para Safari */
  width: 100%;
}

.die::before {
  content: '';
  display: block;
  padding-bottom: 100%;
}

.die-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.die:hover{
  border-color: var(--gold);
  transform: translateY(-2px);
  box-shadow: var(--glow-gold);
}

.die-shape{
  width: 36px;
  height: 36px;
  color: var(--gold-bright);
  margin-bottom: 6px;
}

.die-label{
  font-size: 14px;
  letter-spacing: 0.1em;
  color: var(--ink-dim);
}

.die-count{
  position:absolute;
  top: 4px;
  right: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold-bright);
  font-weight: 600;
}

.dice-options{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 24px;
}

.opt-label{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 10px;
  display: block;
}

.mod-control{
  display: flex;
  align-items: center;
  border: 1px solid var(--line-bright);
  background: var(--bg-deep);
}

.mod-btn{
  width: 40px;
  height: 44px;
  background: transparent;
  border: none;
  color: var(--ink);
  font-family: var(--font-title);
  font-size: 22px;
  cursor: pointer;
  transition: color 0.2s;
  -webkit-appearance: none;
  appearance: none;
}

.mod-btn:hover{
  color: var(--gold-bright);
}

.mod-val{
  flex: 1;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 18px;
  color: var(--ink);
  padding: 10px;
}

.adv-group{
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border: 1px solid var(--line-bright);
}

.adv-opt{
  padding: 11px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-align: center;
  background: transparent;
  border: none;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.2s;
  -webkit-appearance: none;
  appearance: none;
}

.adv-opt + .adv-opt{
  border-left: 1px solid var(--line-bright);
}

.adv-opt.active{
  background: var(--gold);
  color: var(--bg-void);
}

.dice-buttons{
  display: flex;
  gap: 12px;
  margin-top: 16px;
}

.dice-buttons .btn{
  flex: 1;
  justify-content: center;
  padding: 16px;
}

/* ========== RESULT DISPLAY ========== */
.dice-result{
  background: var(--bg-card);
  border: 1px solid var(--line);
  padding: 36px 28px;
  min-height: 320px;
  display: flex;
  flex-direction: column;
}

.result-empty{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--ink-soft);
  font-style: italic;
  text-align: center;
}

.result-empty-rune{
  font-size: 64px;
  color: var(--arcane-deep);
  margin-bottom: 16px;
  font-family: var(--font-display);
}

.result-total{
  text-align: center;
  margin-bottom: 24px;
}

.result-total-num{
  font-family: var(--font-title);
  font-weight: 600;
  font-size: 110px;
  line-height: 1;
  color: var(--gold-bright);
  text-shadow: var(--glow-gold);
}

.result-total-num.crit{
  color: var(--emerald);
  text-shadow: 0 0 30px rgba(74, 155, 110, 0.6);
}

.result-total-num.fumble{
  color: var(--blood);
  text-shadow: 0 0 30px rgba(177, 58, 58, 0.6);
}

.result-formula{
  text-align: center;
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.15em;
  color: var(--ink-dim);
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.result-breakdown{
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-dim);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}

.r-die{
  padding: 4px 9px;
  background: var(--bg-deep);
  border: 1px solid var(--line-bright);
  border-radius: 2px;
}

.r-die.max{
  border-color: var(--emerald);
  color: var(--emerald);
}

.r-die.min{
  border-color: var(--blood);
  color: var(--blood);
}

.r-die.dropped{
  opacity: 0.35;
  text-decoration: line-through;
}

/* ========== HISTORY ========== */
.history{
  margin-top: 36px;
}

.history-title{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.history-clear{
  background: none;
  border: none;
  color: var(--ink-soft);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  cursor: pointer;
  text-transform: uppercase;
  -webkit-appearance: none;
  appearance: none;
}

.history-clear:hover{
  color: var(--blood);
}

.history-list{
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 240px;
  overflow-y: auto;
}

.h-item{
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--bg-deep);
  border-left: 2px solid var(--line-bright);
  font-family: var(--font-mono);
  font-size: 12px;
}

.h-formula{
  color: var(--ink-dim);
}

.h-result{
  color: var(--gold-bright);
  font-weight: 600;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .app {

  .hero,

  }
  
  .section-line {

  }
  
  .dice-layout {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 480px) {
  .dice-row {
    grid-template-columns: repeat(4, 1fr);
  }
  
  .dice-options {
    grid-template-columns: 1fr;
  }
}
